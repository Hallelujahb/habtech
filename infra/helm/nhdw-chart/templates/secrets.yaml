# Real deployments pull these from a secret manager (Vault, AWS Secrets
# Manager, sealed-secrets) via an external-secrets operator, not from
# `helm install --set`. This template is the placeholder that gets
# replaced in that setup -- left explicit so it's obvious where secrets
# management plugs in, per DATA_GOVERNANCE_NOTE.md's minimal-surface
# principle applied to infra, not just to the LLM-linking step.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-postgres-secret
type: Opaque
stringData:
  password: {{ .Values.postgres.credentials.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-clickhouse-secret
type: Opaque
stringData:
  password: {{ .Values.clickhouse.credentials.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-minio-secret
type: Opaque
stringData:
  password: {{ .Values.minio.rootPassword | quote }}
