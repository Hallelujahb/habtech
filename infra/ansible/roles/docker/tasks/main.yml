---
- name: Install Docker prerequisites
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Install docker.io
  apt:
    name: docker.io
    state: present

- name: Ensure docker is enabled and running
  systemd:
    name: docker
    enabled: true
    state: started

- name: Add deploy user to docker group
  user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
